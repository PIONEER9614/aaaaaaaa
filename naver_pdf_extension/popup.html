<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', sans-serif;
    width: 280px;
    background: #f8f9fa;
  }
  .header {
    background: #1a3a5c;
    color: white;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .body { padding: 16px; }
  .url-box {
    font-size: 11px;
    color: #666;
    background: #eee;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 12px;
    word-break: break-all;
    max-height: 48px;
    overflow: hidden;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #1a3a5c;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: #2c5282; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .status {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    display: none;
  }
  .status.loading { background: #e8f4fd; color: #1a6fb5; display: block; }
  .status.success { background: #e8f8e8; color: #2e7d32; display: block; }
  .status.error   { background: #fde8e8; color: #c62828; display: block; }
  .warn {
    font-size: 11px;
    color: #888;
    margin-top: 10px;
    text-align: center;
  }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #1a6fb5;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">📄 페이지 PDF 저장기 &nbsp;<span id="siteLabel" style="font-size:11px;opacity:0.8"></span></div>
<div class="body">
  <div class="url-box" id="urlBox">페이지 확인 중...</div>
  <button id="btn">PDF로 저장</button>
  <div class="status" id="status"></div>
  <p class="warn" id="warn"></p>
</div>
<script src="popup.js"></script>
</body>
</html>
