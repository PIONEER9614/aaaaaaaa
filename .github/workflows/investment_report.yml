name: 투자 인텔리전스 리포트

on:
  schedule:
    - cron: "0 13 * * *"  # 매일 오후 10시 KST (UTC 13:00)
  workflow_dispatch:
    inputs:
      report_type:
        description: "리포트 유형 선택"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - daily
          - weekly
          - monthly

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한국어 폰트 설치
        run: sudo apt-get install -y fonts-nanum

      - name: 패키지 설치
        run: |
          pip install \
            feedparser \
            python-dotenv \
            requests \
            groq \
            beautifulsoup4 \
            reportlab

      - name: 리포트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPORT_TYPE: ${{ github.event.inputs.report_type || 'auto' }}
        run: python investment_report.py
