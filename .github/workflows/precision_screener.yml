name: 정밀 스크리너

on:
  schedule:
    - cron: "0 23 * * 1-5"  # 화~토 오전 8시 KST (전날 한국·미국 장 마감 반영)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install python-dotenv requests pandas yfinance reportlab

      - name: 스크리너 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: python -u precision_screener.py --summary

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precision_screener
          git commit -m "chore: 정밀 스크리너 $(TZ=Asia/Seoul date +%F)" || exit 0
          git pull --rebase || true
          git push || true
