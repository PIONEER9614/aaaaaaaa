name: 네이버 리서치 리포트 다운로드

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다 (KST 09,12,15,18,21,00,03,06시) - 한 번 실패해도 다음 회차에서 재시도됨
  workflow_dispatch:
    inputs:
      days:
        description: "몇 일치를 다시 훑을지 (백필용, 기본 7)"
        required: false
        default: "7"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install requests beautifulsoup4 python-dotenv playwright
          playwright install --with-deps chromium

      - name: 리포트 다운로드
        run: python naver_research_downloader.py --days "${{ github.event.inputs.days || '7' }}"

      - name: 매니페스트 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/naver_research/_meta/ || true
          git diff --cached --quiet || git commit -m "chore: 네이버 리서치 매니페스트 업데이트 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase || true
          git push || true
