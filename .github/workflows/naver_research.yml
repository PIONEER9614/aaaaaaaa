name: 네이버 리서치 리포트 다운로드

on:
  schedule:
    - cron: "0 1 * * *"   # KST 매일 오전 10시 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 python-dotenv

      - name: 리포트 다운로드
        run: python naver_research_downloader.py --days 7

      - name: 매니페스트 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/naver_research/_meta/ || true
          git diff --cached --quiet || git commit -m "chore: 네이버 리서치 매니페스트 업데이트 $(date +'%Y-%m-%d')"
          git push || true
