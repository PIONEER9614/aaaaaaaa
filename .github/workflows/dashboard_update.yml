name: 대시보드 데이터 업데이트

on:
  schedule:
    - cron: "30 10 * * 1-5"  # 평일 오후 7시 30분 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 데이터 수집
        run: python data_collector.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/reports.json docs/data/market_events.json
          git diff --cached --quiet || git commit -m "auto: 대시보드 데이터 업데이트 $(date +'%Y-%m-%d')"
          git push
