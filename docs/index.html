<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투자 인텔리전스 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; overflow: hidden; }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
      height: 52px;
    }
    header h1 { font-size: 1.2rem; color: #fff; }
    header .updated { font-size: 0.78rem; color: #666; }

    /* 3단 레이아웃 */
    .layout {
      display: grid;
      grid-template-columns: 200px 1fr 320px;
      height: calc(100vh - 52px);
    }

    /* ── 왼쪽: 섹터 필터 사이드바 ── */
    .sidebar {
      background: #1a1a2e;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      padding: 14px 12px;
    }
    .sidebar-section { margin-bottom: 20px; }
    .sidebar h3 { font-size: 0.68rem; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

    .sector-btn {
      display: flex; align-items: center; width: 100%;
      background: transparent; border: 1px solid transparent;
      color: #999; padding: 6px 8px; margin-bottom: 2px;
      border-radius: 6px; cursor: pointer; font-size: 0.8rem;
      transition: all 0.15s; text-align: left;
    }
    .sector-btn:hover { background: #1e2a45; color: #ddd; }
    .sector-btn.active { background: #0f3460; border-color: #4a90d9; color: #fff; }
    .sector-dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }

    .event-item {
      background: #12172a; border-left: 3px solid #c0392b;
      padding: 6px 8px; margin-bottom: 4px; border-radius: 4px;
      font-size: 0.72rem; cursor: pointer;
    }
    .event-item:hover { background: #1a2035; }
    .event-item .event-date { color: #c0392b; font-weight: bold; font-size: 0.68rem; }
    .event-item .event-name { color: #ccc; margin-top: 1px; }

    /* ── 가운데: 캘린더 ── */
    .calendar-wrap {
      background: #0f1117;
      padding: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* FullCalendar 다크 스타일 */
    #calendar { flex: 1; min-height: 0; }
    .fc { height: 100% !important; color: #ccc; }
    .fc-view-harness { height: 100% !important; }
    .fc-toolbar-title { color: #fff !important; font-size: 0.95rem !important; }
    .fc-button {
      background: #1a1a2e !important; border: 1px solid #2a2a4a !important;
      color: #aaa !important; font-size: 0.75rem !important;
      padding: 3px 8px !important; border-radius: 5px !important;
    }
    .fc-button:hover { background: #0f3460 !important; color: #fff !important; }
    .fc-day-today { background: rgba(74,144,217,0.08) !important; }
    .fc-day-today .fc-daygrid-day-number { color: #4a90d9 !important; font-weight: bold; }
    .fc-daygrid-day-number { color: #666; font-size: 0.72rem; padding: 3px 5px !important; }
    .fc-col-header-cell { background: #12172a; }
    .fc-col-header-cell-cushion { color: #555; font-size: 0.7rem; text-transform: uppercase; padding: 4px !important; }
    .fc-scrollgrid { border-color: #1e2a3a !important; }
    .fc-scrollgrid-sync-table { height: 100% !important; }
    .fc-scrollgrid td, .fc-scrollgrid th { border-color: #1e2a3a !important; }
    .fc-daygrid-day { cursor: pointer; transition: background 0.15s; }
    .fc-daygrid-day:hover { background: rgba(74,144,217,0.05) !important; }
    .fc-daygrid-day.fc-day-selected { background: rgba(74,144,217,0.15) !important; outline: 1px solid #4a90d9; }
    .fc-event {
      border-radius: 2px !important; font-size: 0.62rem !important;
      padding: 0 3px !important; cursor: pointer !important;
      border: none !important; margin-bottom: 1px !important;
      line-height: 1.6 !important;
    }
    .fc-daygrid-event-harness { margin-bottom: 1px !important; }
    .fc-daygrid-more-link { color: #4a90d9 !important; font-size: 0.62rem !important; }
    .fc-toolbar { margin-bottom: 8px !important; }

    /* ── 오른쪽: 날짜 상세 패널 ── */
    .detail-panel {
      border-left: 1px solid #2a2a4a;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .detail-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #1e2a3a;
      flex-shrink: 0;
    }
    .detail-header-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .detail-title { font-size: 0.9rem; color: #fff; font-weight: 600; }
    .detail-count { font-size: 0.72rem; color: #555; }
    .detail-hint { font-size: 0.72rem; color: #444; }
    .detail-clear {
      font-size: 0.72rem; color: #4a90d9; cursor: pointer;
      background: none; border: none; display: none;
    }
    .detail-clear:hover { text-decoration: underline; }

    .detail-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

    /* 리포트 리스트 아이템 */
    .report-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px; margin-bottom: 6px;
      background: #1a1a2e; border: 1px solid #1e2a3a;
      border-radius: 8px; cursor: pointer;
      transition: border-color 0.15s;
    }
    .report-item:hover { border-color: #4a90d9; }
    .report-item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .report-item-body { flex: 1; min-width: 0; }
    .report-item-sector { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
    .report-item-main { font-size: 0.82rem; color: #fff; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-item-sub { font-size: 0.72rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-item-badge {
      font-size: 0.6rem; color: #777; background: #12172a;
      border-radius: 3px; padding: 1px 5px; flex-shrink: 0;
      margin-top: 2px; align-self: flex-start;
    }

    /* 카드 그리드 (기본 전체 뷰) */
    .cards-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .card {
      background: #1a1a2e; border: 1px solid #1e2a3a;
      border-radius: 8px; padding: 10px 12px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .card:hover { border-color: #4a90d9; }
    .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .card-sector-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
    .card-date { font-size: 0.65rem; color: #555; margin-left: auto; }
    .card-main { font-size: 0.82rem; color: #fff; font-weight: 600; margin-bottom: 2px; }
    .card-firm { font-size: 0.7rem; color: #666; }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 12px; padding: 22px; max-width: 600px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .modal-header h2 { color: #fff; font-size: 0.92rem; line-height: 1.5; flex: 1; }
    .modal-close { background: none; border: none; color: #555; font-size: 1.1rem; cursor: pointer; margin-left: 10px; }
    .modal-close:hover { color: #ccc; }
    .modal-body { font-size: 0.83rem; color: #bbb; line-height: 1.8; }
    .modal-body b { color: #999; }
    .modal-body a { color: #4a90d9; }

    .empty-msg { text-align: center; color: #333; padding: 30px 16px; font-size: 0.8rem; line-height: 1.8; }
  </style>
</head>
<body>

<header>
  <h1>📊 투자 인텔리전스 대시보드</h1>
  <span class="updated" id="last-updated">로딩 중...</span>
</header>

<div class="layout">

  <!-- 왼쪽: 섹터 + 증시 일정 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>섹터 필터</h3>
      <button class="sector-btn active" onclick="filterSector('전체', this)">
        <span class="sector-dot" style="background:#555"></span>전체
      </button>
      <div id="sector-buttons"></div>
    </div>

    <div class="sidebar-section">
      <h3>📅 증시 일정</h3>
      <div id="market-events-list">
        <div style="color:#333;font-size:0.75rem;padding:6px 0">로딩 중...</div>
      </div>
    </div>
  </aside>

  <!-- 가운데: 캘린더 -->
  <div class="calendar-wrap">
    <div id="calendar"></div>
  </div>

  <!-- 오른쪽: 날짜 상세 패널 -->
  <aside class="detail-panel">
    <div class="detail-header">
      <div class="detail-header-top">
        <span class="detail-title" id="detail-title">전체 리포트</span>
        <button class="detail-clear" id="detail-clear" onclick="clearDateFilter()">✕ 해제</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="detail-hint" id="detail-hint">날짜를 클릭하면 해당 날 리포트가 표시됩니다</span>
        <span class="detail-count" id="detail-count"></span>
      </div>
    </div>
    <div class="detail-body" id="detail-body">
      <div class="empty-msg">로딩 중...</div>
    </div>
  </aside>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const SECTOR_COLORS = {
  "반도체": "#4a90d9", "로봇": "#2ecc71", "방산": "#e74c3c",
  "조선": "#f39c12",   "2차전지": "#9b59b6", "바이오": "#1abc9c",
  "플랫폼": "#e67e22", "자동차": "#d35400", "금융": "#27ae60",
  "건설": "#7f8c8d",   "철강": "#95a5a6",   "에너지": "#f1c40f",
};

let allReports = [], allEvents = [], calendar;
let currentSector = "전체", selectedDate = null, selectedDayEl = null;

async function loadData() {
  try {
    const [rRes, eRes] = await Promise.all([
      fetch("data/reports.json?t=" + Date.now()),
      fetch("data/market_events.json?t=" + Date.now()),
    ]);
    allReports = rRes.ok ? await rRes.json() : [];
    allEvents  = eRes.ok ? await eRes.json() : [];
  } catch(e) { allReports = []; allEvents = []; }

  setupSectorButtons();
  setupCalendar();
  renderDetail();
  renderMarketEvents();

  const d = allReports.length ? allReports[0].date : "-";
  document.getElementById("last-updated").textContent = "업데이트: " + d;
}

function getFiltered() {
  let list = currentSector === "전체" ? allReports : allReports.filter(r => r.sector === currentSector);
  if (selectedDate) list = list.filter(r => r.date === selectedDate);
  return list;
}

// ── 섹터 버튼 ──────────────────────────────────────────────────────────────
function setupSectorButtons() {
  const sectors = [...new Set(allReports.map(r => r.sector))].filter(Boolean).sort();
  const el = document.getElementById("sector-buttons");
  el.innerHTML = sectors.map(s => {
    const c = SECTOR_COLORS[s] || "#888";
    return `<button class="sector-btn" onclick="filterSector('${s}', this)">
      <span class="sector-dot" style="background:${c}"></span>${s}
    </button>`;
  }).join("");
}

function filterSector(sector, btn) {
  currentSector = sector;
  document.querySelectorAll(".sector-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  calendar.getEvents().forEach(ev => {
    if (ev.extendedProps.type === "market_event") return;
    ev.setProp("display", sector === "전체" || ev.extendedProps.sector === sector ? "auto" : "none");
  });
  renderDetail();
}

// ── 캘린더 ─────────────────────────────────────────────────────────────────
function setupCalendar() {
  const calEvents = allReports.map(r => ({
    title: r.company,
    date: r.date,
    color: SECTOR_COLORS[r.sector] || "#444",
    extendedProps: r,
  }));
  const mktEvents = allEvents.map(e => ({
    title: "⚡ " + e.name,
    date: e.date,
    color: "#8b1a1a",
    textColor: "#ff8080",
    extendedProps: { type: "market_event", ...e },
  }));

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    locale: "ko",
    height: "100%",
    expandRows: true,          // 행 높이를 컨테이너에 맞게 확장
    dayMaxEvents: 4,           // 칸당 최대 4개 표시
    events: [...calEvents, ...mktEvents],

    // 날짜 칸 클릭
    dateClick: (info) => {
      const d = info.dateStr;
      if (selectedDate === d) { clearDateFilter(); return; }
      if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
      selectedDate = d;
      selectedDayEl = info.dayEl;
      info.dayEl.classList.add("fc-day-selected");
      document.getElementById("detail-clear").style.display = "inline";
      document.getElementById("detail-hint").style.display = "none";
      renderDetail();
    },

    // 이벤트 클릭
    eventClick: (info) => {
      info.jsEvent.stopPropagation();
      const p = info.event.extendedProps;
      if (p.type === "market_event") {
        showModal(p.name, `<b>날짜:</b> ${p.date}<br><br>${p.description || ""}`);
      } else {
        openReportModal(p);
      }
    },

    // "+N more" 클릭 → 날짜 필터로 처리
    moreLinkClick: (info) => {
      const d = info.date.toISOString().split("T")[0];
      if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
      selectedDate = d;
      selectedDayEl = info.allSegs[0]?.el?.closest(".fc-daygrid-day") || null;
      if (selectedDayEl) selectedDayEl.classList.add("fc-day-selected");
      document.getElementById("detail-clear").style.display = "inline";
      document.getElementById("detail-hint").style.display = "none";
      renderDetail();
      return "stop";
    },

    headerToolbar: { left: "prev,next today", center: "title", right: "" },
  });
  calendar.render();
}

// ── 날짜 필터 해제 ─────────────────────────────────────────────────────────
function clearDateFilter() {
  selectedDate = null;
  if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
  selectedDayEl = null;
  document.getElementById("detail-clear").style.display = "none";
  document.getElementById("detail-hint").style.display = "inline";
  renderDetail();
}

// ── 오른쪽 패널 렌더링 ─────────────────────────────────────────────────────
function renderDetail() {
  const reports = getFiltered();
  const titleEl = document.getElementById("detail-title");
  const countEl = document.getElementById("detail-count");
  const body    = document.getElementById("detail-body");

  titleEl.textContent = selectedDate
    ? selectedDate + " 리포트"
    : (currentSector === "전체" ? "최신 리포트" : currentSector + " 리포트");
  countEl.textContent = reports.length + "개";

  if (!reports.length) {
    body.innerHTML = '<div class="empty-msg">리포트가 없습니다</div>';
    return;
  }

  // 날짜 선택 → 리스트, 미선택 → 카드
  if (selectedDate) {
    body.innerHTML = reports.map(r => reportItem(r)).join("");
  } else {
    body.innerHTML = `<div class="cards-grid">${reports.slice(0, 80).map(r => reportCard(r)).join("")}</div>`;
  }
}

function reportItem(r) {
  const c = SECTOR_COLORS[r.sector] || "#888";
  const badge = r.type === "industry" ? "산업" : "종목";
  return `<div class="report-item" onclick='openReportModal(${escJson(r)})'>
    <div class="report-item-dot" style="background:${c}"></div>
    <div class="report-item-body">
      <div class="report-item-sector" style="color:${c}">${r.sector}</div>
      <div class="report-item-main">${r.company} · ${r.firm}</div>
      <div class="report-item-sub">${r.title || ""}</div>
    </div>
    <div class="report-item-badge">${badge}</div>
  </div>`;
}

function reportCard(r) {
  const c = SECTOR_COLORS[r.sector] || "#888";
  return `<div class="card" onclick='openReportModal(${escJson(r)})'>
    <div class="card-top">
      <span class="card-sector-tag" style="color:${c}">${r.sector}</span>
      <span class="card-date">${r.date}</span>
    </div>
    <div class="card-main">${r.company} · ${r.firm}</div>
    <div class="card-firm">${(r.title || "").substring(0, 42)}</div>
  </div>`;
}

function escJson(r) {
  return JSON.stringify(r).replace(/"/g, "&quot;");
}

// ── 증시 일정 ──────────────────────────────────────────────────────────────
function renderMarketEvents() {
  const today = new Date().toISOString().split("T")[0];
  const upcoming = allEvents.filter(e => e.date >= today).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 8);
  const el = document.getElementById("market-events-list");
  el.innerHTML = upcoming.length
    ? upcoming.map(e => `
        <div class="event-item" onclick="showModal('${e.name}','<b>날짜:</b> ${e.date}<br><br>${(e.description||"").replace(/'/g,"\\'")}')">
          <div class="event-date">${e.date}</div>
          <div class="event-name">${e.name}</div>
        </div>`).join("")
    : '<div style="color:#333;font-size:0.75rem">일정 없음</div>';
}

// ── 모달 ───────────────────────────────────────────────────────────────────
function openReportModal(r) {
  if (typeof r === "string") r = JSON.parse(r);
  const price   = r.target_price ? `<b>목표주가:</b> ${Number(r.target_price).toLocaleString()}원<br>` : "";
  const summary = r.summary ? `<br><b>요약:</b><br>${r.summary.replace(/\n/g,"<br>")}` : "";
  const link    = r.link ? `<br><br><a href="${r.link}" target="_blank">원문 보기 →</a>` : "";
  showModal(
    `[${r.sector}] ${r.company} — ${r.firm}`,
    `<b>날짜:</b> ${r.date}<br><b>리포트:</b> ${r.title || "-"}<br>${price}${summary}${link}`
  );
}
function showModal(title, body) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal").classList.add("open");
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });

loadData();
</script>
</body>
</html>
