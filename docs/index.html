<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투자 인텔리전스 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; overflow: hidden; }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
      height: 52px;
    }
    header h1 { font-size: 1.2rem; color: #fff; }
    header .updated { font-size: 0.78rem; color: #666; }

    /* 3단 레이아웃 */
    .layout {
      display: grid;
      grid-template-columns: 190px 1fr 520px;
      height: calc(100vh - 52px);
    }

    /* ── 왼쪽: 섹터 필터 ── */
    .sidebar {
      background: #1a1a2e;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      padding: 14px 12px;
    }
    .sidebar h3 { font-size: 0.67rem; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .sidebar-section { margin-bottom: 20px; }

    .sector-btn {
      display: flex; align-items: center; width: 100%;
      background: transparent; border: 1px solid transparent;
      color: #999; padding: 6px 8px; margin-bottom: 2px;
      border-radius: 6px; cursor: pointer; font-size: 0.8rem;
      transition: all 0.15s;
    }
    .sector-btn:hover { background: #1e2a45; color: #ddd; }
    .sector-btn.active { background: #0f3460; border-color: #4a90d9; color: #fff; }
    .sector-dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }

    .event-item {
      background: #12172a; border-left: 3px solid #c0392b;
      padding: 6px 8px; margin-bottom: 4px; border-radius: 4px;
      font-size: 0.72rem; cursor: pointer;
    }
    .event-item:hover { background: #1a2035; }
    .event-item .event-date { color: #c0392b; font-weight: bold; font-size: 0.67rem; }
    .event-item .event-name { color: #ccc; margin-top: 1px; }

    /* ── 가운데: 캘린더 ── */
    .calendar-wrap {
      background: #0f1117;
      padding: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #calendar { flex: 1; min-height: 0; }

    /* FullCalendar 다크 스타일 */
    .fc { height: 100% !important; color: #ccc; }
    .fc-view-harness { height: 100% !important; }
    .fc-toolbar { margin-bottom: 8px !important; }
    .fc-toolbar-title { color: #fff !important; font-size: 0.95rem !important; }
    .fc-button {
      background: #1a1a2e !important; border: 1px solid #2a2a4a !important;
      color: #aaa !important; font-size: 0.74rem !important;
      padding: 3px 8px !important; border-radius: 5px !important;
    }
    .fc-button:hover { background: #0f3460 !important; color: #fff !important; }
    .fc-day-today { background: rgba(74,144,217,0.08) !important; }
    .fc-day-today .fc-daygrid-day-number { color: #4a90d9 !important; font-weight: bold; }
    .fc-daygrid-day-number { color: #666; font-size: 0.7rem; padding: 2px 4px !important; }
    .fc-col-header-cell { background: #12172a; }
    .fc-col-header-cell-cushion { color: #555; font-size: 0.68rem; text-transform: uppercase; padding: 4px !important; }
    .fc-scrollgrid { border-color: #1e2a3a !important; }
    .fc-scrollgrid-sync-table { height: 100% !important; }
    .fc-scrollgrid td, .fc-scrollgrid th { border-color: #1e2a3a !important; }
    .fc-daygrid-day { cursor: pointer; transition: background 0.15s; }
    .fc-daygrid-day:hover { background: rgba(74,144,217,0.05) !important; }
    .fc-daygrid-day.fc-day-selected { background: rgba(74,144,217,0.14) !important; outline: 1px solid #3a7bc8; }
    .fc-event {
      border-radius: 2px !important; font-size: 0.6rem !important;
      padding: 0 3px !important; border: none !important;
      margin-bottom: 1px !important; line-height: 1.55 !important;
      cursor: pointer !important;
    }
    .fc-daygrid-event-harness { margin-bottom: 1px !important; }
    .fc-daygrid-more-link { color: #4a90d9 !important; font-size: 0.6rem !important; }

    /* 날짜 수 배지 */
    .day-count-badge {
      display: inline-block;
      background: #1e3a5f; color: #5a9fd4;
      border-radius: 8px; padding: 0 5px;
      font-size: 0.58rem; font-weight: 700;
      line-height: 1.6; margin-left: 3px;
      vertical-align: middle;
    }

    /* ── 오른쪽: 상세 패널 ── */
    .detail-panel {
      border-left: 1px solid #2a2a4a;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .detail-header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid #1e2a3a;
      flex-shrink: 0;
    }
    .detail-header-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .detail-title { font-size: 0.9rem; color: #fff; font-weight: 600; }
    .detail-meta { font-size: 0.72rem; color: #555; }
    .detail-clear {
      font-size: 0.72rem; color: #4a90d9;
      background: none; border: none; cursor: pointer; display: none;
    }
    .detail-clear:hover { text-decoration: underline; }

    /* 섹터 요약 바 */
    .sector-summary {
      display: flex; flex-wrap: wrap; gap: 5px;
      padding: 8px 14px;
      border-bottom: 1px solid #1a2030;
      flex-shrink: 0;
    }
    .sector-chip {
      display: flex; align-items: center; gap: 4px;
      background: #12172a; border-radius: 10px;
      padding: 2px 8px; font-size: 0.68rem; color: #aaa;
    }
    .sector-chip-dot { width: 6px; height: 6px; border-radius: 50%; }
    .sector-chip-count { font-weight: 700; }

    /* 그리드 패널 */
    .detail-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }
    .report-card {
      background: #1a1a2e; border: 1px solid #1e2a3a;
      border-radius: 7px; padding: 9px 10px;
      cursor: pointer; transition: border-color 0.15s;
      min-width: 0;
    }
    .report-card:hover { border-color: #4a90d9; }
    .report-card-sector { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 3px; }
    .report-card-company { font-size: 0.78rem; color: #eee; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-card-firm { font-size: 0.65rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-card-title { font-size: 0.62rem; color: #555; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-card-badge {
      display: inline-block; margin-top: 4px;
      font-size: 0.55rem; color: #888; background: #12172a;
      border-radius: 3px; padding: 1px 4px;
    }

    /* 기본 상태(날짜 미선택) - 넓은 카드 */
    .report-grid-default {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }
    .report-card-default {
      background: #1a1a2e; border: 1px solid #1e2a3a;
      border-radius: 7px; padding: 9px 12px;
      cursor: pointer; transition: border-color 0.15s;
      display: flex; align-items: center; gap: 8px;
    }
    .report-card-default:hover { border-color: #4a90d9; }
    .report-card-default-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .report-card-default-body { min-width: 0; }
    .report-card-default-top { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 2px; }
    .report-card-default-main { font-size: 0.8rem; color: #eee; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-card-default-sub { font-size: 0.65rem; color: #666; }
    .report-card-default-date { font-size: 0.62rem; color: #555; margin-left: auto; flex-shrink: 0; }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 12px; padding: 22px; max-width: 600px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .modal-header h2 { color: #fff; font-size: 0.92rem; line-height: 1.5; flex: 1; }
    .modal-close { background: none; border: none; color: #555; font-size: 1.1rem; cursor: pointer; margin-left: 10px; }
    .modal-close:hover { color: #ccc; }
    .modal-body { font-size: 0.83rem; color: #bbb; line-height: 1.8; }
    .modal-body b { color: #999; }
    .modal-body a { color: #4a90d9; }

    .empty-msg { text-align: center; color: #333; padding: 30px 16px; font-size: 0.8rem; }
  </style>
</head>
<body>

<header>
  <h1>📊 투자 인텔리전스 대시보드</h1>
  <span class="updated" id="last-updated">로딩 중...</span>
</header>

<div class="layout">

  <!-- 왼쪽: 섹터 + 증시 일정 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>섹터 필터</h3>
      <button class="sector-btn active" onclick="filterSector('전체', this)">
        <span class="sector-dot" style="background:#555"></span>전체
      </button>
      <div id="sector-buttons"></div>
    </div>
    <div class="sidebar-section">
      <h3>📅 증시 일정</h3>
      <div id="market-events-list">
        <div style="color:#333;font-size:0.75rem;padding:4px 0">로딩 중...</div>
      </div>
    </div>
  </aside>

  <!-- 가운데: 캘린더 -->
  <div class="calendar-wrap">
    <div id="calendar"></div>
  </div>

  <!-- 오른쪽: 상세 패널 -->
  <aside class="detail-panel">
    <div class="detail-header">
      <div class="detail-header-row">
        <span class="detail-title" id="detail-title">최신 리포트</span>
        <button class="detail-clear" id="detail-clear" onclick="clearDateFilter()">✕ 날짜 해제</button>
      </div>
      <div class="detail-header-row">
        <span class="detail-meta" id="detail-hint">날짜를 클릭하면 해당 날 리포트를 봅니다</span>
        <span class="detail-meta" id="detail-count"></span>
      </div>
    </div>
    <!-- 섹터별 수량 요약 -->
    <div class="sector-summary" id="sector-summary"></div>
    <!-- 리포트 그리드 -->
    <div class="detail-body" id="detail-body">
      <div class="empty-msg">로딩 중...</div>
    </div>
  </aside>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const SECTOR_COLORS = {
  "반도체":"#4a90d9","로봇":"#2ecc71","방산":"#e74c3c",
  "조선":"#f39c12","2차전지":"#9b59b6","바이오":"#1abc9c",
  "플랫폼":"#e67e22","자동차":"#d35400","금융":"#27ae60",
  "건설":"#7f8c8d","철강":"#95a5a6","에너지":"#f1c40f",
};

let allReports = [], allEvents = [], calendar;
let currentSector = "전체", selectedDate = null, selectedDayEl = null;

// ── 데이터 로드 ────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [rRes, eRes] = await Promise.all([
      fetch("data/reports.json?t=" + Date.now()),
      fetch("data/market_events.json?t=" + Date.now()),
    ]);
    allReports = rRes.ok ? await rRes.json() : [];
    allEvents  = eRes.ok ? await eRes.json() : [];
  } catch(e) { allReports = []; allEvents = []; }

  setupSectorButtons();
  setupCalendar();
  renderDetail();
  renderMarketEvents();

  const d = allReports.length ? allReports[0].date : "-";
  document.getElementById("last-updated").textContent = "업데이트: " + d;
}

function getFiltered() {
  let list = currentSector === "전체" ? allReports : allReports.filter(r => r.sector === currentSector);
  if (selectedDate) list = list.filter(r => r.date === selectedDate);
  return list;
}

// ── 섹터 버튼 ──────────────────────────────────────────────────────────────
function setupSectorButtons() {
  const sectors = [...new Set(allReports.map(r => r.sector))].filter(Boolean).sort();
  document.getElementById("sector-buttons").innerHTML = sectors.map(s => {
    const c = SECTOR_COLORS[s] || "#888";
    return `<button class="sector-btn" onclick="filterSector('${s}',this)">
      <span class="sector-dot" style="background:${c}"></span>${s}
    </button>`;
  }).join("");
}

function filterSector(sector, btn) {
  currentSector = sector;
  document.querySelectorAll(".sector-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  calendar.getEvents().forEach(ev => {
    if (ev.extendedProps.type === "market_event") return;
    ev.setProp("display", sector === "전체" || ev.extendedProps.sector === sector ? "auto" : "none");
  });
  renderDetail();
}

// ── 캘린더 ─────────────────────────────────────────────────────────────────
function setupCalendar() {
  // 날짜별 리포트 수 집계
  const countByDate = {};
  allReports.forEach(r => { countByDate[r.date] = (countByDate[r.date] || 0) + 1; });

  const calEvents = allReports.map(r => ({
    title: r.company,
    date: r.date,
    color: SECTOR_COLORS[r.sector] || "#444",
    extendedProps: r,
  }));
  const mktEvents = allEvents.map(e => ({
    title: "⚡ " + e.name,
    date: e.date,
    color: "#7b1a1a",
    textColor: "#ff8080",
    extendedProps: { type: "market_event", ...e },
  }));

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    locale: "ko",
    height: "100%",
    expandRows: true,
    dayMaxEvents: 3,
    events: [...calEvents, ...mktEvents],

    // 날짜 칸에 리포트 수 배지 추가
    dayCellDidMount: (info) => {
      const d = info.date.toISOString().split("T")[0];
      const cnt = countByDate[d];
      if (cnt) {
        const num = info.el.querySelector(".fc-daygrid-day-number");
        if (num) {
          const badge = document.createElement("span");
          badge.className = "day-count-badge";
          badge.textContent = cnt;
          num.appendChild(badge);
        }
      }
    },

    dateClick: (info) => {
      const d = info.dateStr;
      if (selectedDate === d) { clearDateFilter(); return; }
      if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
      selectedDate = d;
      selectedDayEl = info.dayEl;
      info.dayEl.classList.add("fc-day-selected");
      document.getElementById("detail-clear").style.display = "inline";
      document.getElementById("detail-hint").textContent = d + " 리포트";
      renderDetail();
    },

    eventClick: (info) => {
      info.jsEvent.stopPropagation();
      const p = info.event.extendedProps;
      if (p.type === "market_event") {
        showModal(p.name, `<b>날짜:</b> ${p.date}<br><br>${p.description || ""}`);
      } else {
        openReportModal(p);
      }
    },

    moreLinkClick: (info) => {
      const d = info.date.toISOString().split("T")[0];
      if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
      selectedDate = d;
      selectedDayEl = info.allSegs[0]?.el?.closest(".fc-daygrid-day") || null;
      if (selectedDayEl) selectedDayEl.classList.add("fc-day-selected");
      document.getElementById("detail-clear").style.display = "inline";
      document.getElementById("detail-hint").textContent = d + " 리포트";
      renderDetail();
      return "stop";
    },

    headerToolbar: { left: "prev,next today", center: "title", right: "" },
  });
  calendar.render();
}

function clearDateFilter() {
  selectedDate = null;
  if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
  selectedDayEl = null;
  document.getElementById("detail-clear").style.display = "none";
  document.getElementById("detail-hint").textContent = "날짜를 클릭하면 해당 날 리포트를 봅니다";
  renderDetail();
}

// ── 오른쪽 패널 렌더링 ─────────────────────────────────────────────────────
function renderDetail() {
  const reports = getFiltered();

  // 제목
  document.getElementById("detail-title").textContent =
    selectedDate ? selectedDate : (currentSector === "전체" ? "최신 리포트" : currentSector + " 리포트");
  document.getElementById("detail-count").textContent = reports.length + "개";

  // 섹터별 수량 요약
  renderSectorSummary(reports);

  const body = document.getElementById("detail-body");
  if (!reports.length) {
    body.innerHTML = '<div class="empty-msg">리포트가 없습니다</div>';
    return;
  }

  if (selectedDate) {
    // 날짜 선택 → 4열 그리드
    body.innerHTML = `<div class="report-grid">${reports.map(r => reportCard4(r)).join("")}</div>`;
  } else {
    // 기본 → 2열 넓은 카드
    body.innerHTML = `<div class="report-grid-default">${reports.slice(0, 80).map(r => reportCardDefault(r)).join("")}</div>`;
  }
}

function renderSectorSummary(reports) {
  const counts = {};
  reports.forEach(r => { counts[r.sector] = (counts[r.sector] || 0) + 1; });
  const el = document.getElementById("sector-summary");
  el.innerHTML = Object.entries(counts)
    .sort((a,b) => b[1]-a[1])
    .map(([s, n]) => {
      const c = SECTOR_COLORS[s] || "#888";
      return `<div class="sector-chip">
        <span class="sector-chip-dot" style="background:${c}"></span>
        ${s} <span class="sector-chip-count" style="color:${c}">${n}</span>
      </div>`;
    }).join("");
}

// 4열 작은 카드 (날짜 선택 시)
function reportCard4(r) {
  const c = SECTOR_COLORS[r.sector] || "#888";
  const badge = r.type === "industry" ? "산업" : "종목";
  return `<div class="report-card" onclick='openReportModal(${escJson(r)})'>
    <div class="report-card-sector" style="color:${c}">${r.sector}</div>
    <div class="report-card-company">${r.company}</div>
    <div class="report-card-firm">${r.firm}</div>
    <div class="report-card-title">${r.title || ""}</div>
    <span class="report-card-badge">${badge}</span>
  </div>`;
}

// 2열 기본 카드
function reportCardDefault(r) {
  const c = SECTOR_COLORS[r.sector] || "#888";
  return `<div class="report-card-default" onclick='openReportModal(${escJson(r)})'>
    <div class="report-card-default-dot" style="background:${c}"></div>
    <div class="report-card-default-body">
      <div class="report-card-default-top" style="color:${c}">${r.sector}</div>
      <div class="report-card-default-main">${r.company} · ${r.firm}</div>
      <div class="report-card-default-sub">${(r.title||"").substring(0,36)}</div>
    </div>
    <div class="report-card-default-date">${r.date}</div>
  </div>`;
}

function escJson(r) { return JSON.stringify(r).replace(/"/g,"&quot;"); }

// ── 증시 일정 ──────────────────────────────────────────────────────────────
function renderMarketEvents() {
  const today = new Date().toISOString().split("T")[0];
  const upcoming = allEvents.filter(e => e.date >= today)
    .sort((a,b) => a.date.localeCompare(b.date)).slice(0,8);
  document.getElementById("market-events-list").innerHTML = upcoming.length
    ? upcoming.map(e => `
      <div class="event-item" onclick="showModal('${e.name}','<b>날짜:</b> ${e.date}<br><br>${(e.description||"").replace(/'/g,"\\'")}')">
        <div class="event-date">${e.date}</div>
        <div class="event-name">${e.name}</div>
      </div>`).join("")
    : '<div style="color:#333;font-size:0.75rem">일정 없음</div>';
}

// ── 모달 ───────────────────────────────────────────────────────────────────
function openReportModal(r) {
  if (typeof r === "string") r = JSON.parse(r);
  const price   = r.target_price ? `<b>목표주가:</b> ${Number(r.target_price).toLocaleString()}원<br>` : "";
  const summary = r.summary ? `<br><b>요약:</b><br>${r.summary.replace(/\n/g,"<br>")}` : "";
  const link    = r.link ? `<br><br><a href="${r.link}" target="_blank">원문 보기 →</a>` : "";
  showModal(
    `[${r.sector}] ${r.company} — ${r.firm}`,
    `<b>날짜:</b> ${r.date}<br><b>리포트:</b> ${r.title||"-"}<br>${price}${summary}${link}`
  );
}
function showModal(title, body) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal").classList.add("open");
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

loadData();
</script>
</body>
</html>
