<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투자 인텔리전스 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 16px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
    }
    header h1 { font-size: 1.3rem; color: #fff; }
    header .updated { font-size: 0.8rem; color: #888; }

    .layout { display: flex; height: calc(100vh - 57px); }

    /* 사이드바 */
    .sidebar {
      width: 220px; min-width: 220px;
      background: #1a1a2e;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      padding: 14px;
    }
    .sidebar h3 { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

    .sector-btn {
      display: block; width: 100%; text-align: left;
      background: transparent; border: 1px solid transparent;
      color: #aaa; padding: 7px 10px; margin-bottom: 3px;
      border-radius: 6px; cursor: pointer; font-size: 0.82rem;
      transition: all 0.15s;
    }
    .sector-btn:hover { background: #1e2a45; color: #ddd; }
    .sector-btn.active { background: #0f3460; border-color: #4a90d9; color: #fff; }
    .sector-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; }

    .event-item {
      background: #16213e; border-left: 3px solid #e74c3c;
      padding: 6px 10px; margin-bottom: 5px; border-radius: 4px;
      font-size: 0.75rem;
    }
    .event-item .event-date { color: #e74c3c; font-weight: bold; font-size: 0.7rem; }
    .event-item .event-name { color: #ddd; margin-top: 2px; }

    /* 메인 */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* 캘린더 */
    .calendar-wrap {
      background: #1a1a2e;
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }

    /* FullCalendar 다크 스타일 */
    .fc { color: #ccc; }
    .fc-toolbar-title { color: #fff !important; font-size: 1rem !important; }
    .fc-button { background: #16213e !important; border-color: #2a2a4a !important; color: #ccc !important; font-size: 0.8rem !important; padding: 4px 10px !important; }
    .fc-button:hover { background: #0f3460 !important; }
    .fc-button-active { background: #0f3460 !important; border-color: #4a90d9 !important; }
    .fc-day-today { background: rgba(74, 144, 217, 0.08) !important; }
    .fc-day-today .fc-daygrid-day-number { color: #4a90d9 !important; font-weight: bold; }
    .fc-daygrid-day-number { color: #888; font-size: 0.78rem; }
    .fc-col-header-cell { background: #12172a; }
    .fc-col-header-cell-cushion { color: #666; font-size: 0.75rem; text-transform: uppercase; }
    .fc-scrollgrid { border-color: #2a2a4a !important; }
    .fc-scrollgrid td, .fc-scrollgrid th { border-color: #1e2a3a !important; }
    .fc-daygrid-day { cursor: pointer; transition: background 0.15s; }
    .fc-daygrid-day:hover { background: rgba(74,144,217,0.06) !important; }
    .fc-daygrid-day.fc-day-selected { background: rgba(74,144,217,0.15) !important; }
    .fc-event {
      border-radius: 3px !important; font-size: 0.68rem !important;
      padding: 1px 4px !important; cursor: pointer !important;
      border: none !important; margin-bottom: 1px !important;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fc-daygrid-more-link { color: #4a90d9 !important; font-size: 0.68rem !important; }

    /* 날짜별 리포트 패널 */
    .day-panel {
      flex: 1; overflow-y: auto; padding: 14px 18px;
      background: #0f1117;
    }
    .day-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .day-panel-title {
      font-size: 0.95rem; color: #fff; font-weight: 600;
    }
    .day-panel-count {
      font-size: 0.75rem; color: #666;
      background: #1a1a2e; border-radius: 10px; padding: 2px 10px;
    }
    .day-panel-clear {
      font-size: 0.75rem; color: #4a90d9; cursor: pointer;
      background: none; border: none; padding: 0;
    }
    .day-panel-clear:hover { text-decoration: underline; }

    /* 리포트 리스트 (날짜 클릭 시) */
    .report-list { display: flex; flex-direction: column; gap: 8px; }
    .report-row {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 12px 14px;
      display: flex; align-items: flex-start; gap: 12px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .report-row:hover { border-color: #4a90d9; }
    .report-row-dot {
      width: 10px; height: 10px; border-radius: 50%;
      flex-shrink: 0; margin-top: 4px;
    }
    .report-row-body { flex: 1; min-width: 0; }
    .report-row-sector { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .report-row-title { font-size: 0.88rem; color: #fff; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-row-meta { font-size: 0.72rem; color: #666; }
    .report-row-type {
      font-size: 0.62rem; color: #888; background: #12172a;
      border-radius: 3px; padding: 1px 6px; flex-shrink: 0; margin-top: 2px;
    }

    /* 카드 그리드 (기본 뷰) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .card {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 10px; padding: 14px;
      cursor: pointer; transition: border-color 0.2s;
    }
    .card:hover { border-color: #4a90d9; }
    .card-sector { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .card-title { font-size: 0.88rem; color: #fff; margin-bottom: 5px; font-weight: 600; }
    .card-meta { font-size: 0.72rem; color: #888; margin-bottom: 7px; }
    .card-summary { font-size: 0.8rem; color: #bbb; line-height: 1.5; }
    .card-price {
      display: inline-block; margin-top: 7px;
      background: rgba(46, 204, 113, 0.15); color: #2ecc71;
      border-radius: 4px; padding: 2px 7px; font-size: 0.72rem; font-weight: bold;
    }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 12px; padding: 24px; max-width: 620px; width: 92%;
      max-height: 82vh; overflow-y: auto;
    }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .modal-header h2 { color: #fff; font-size: 0.95rem; line-height: 1.4; flex: 1; }
    .modal-close {
      background: none; border: none;
      color: #666; font-size: 1.2rem; cursor: pointer; margin-left: 12px;
    }
    .modal-close:hover { color: #ccc; }
    .modal-body { font-size: 0.84rem; color: #ccc; line-height: 1.7; }
    .modal-body b { color: #aaa; }
    .modal-body a { color: #4a90d9; }

    .empty-state { text-align: center; color: #444; padding: 40px 20px; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <h1>📊 투자 인텔리전스 대시보드</h1>
  <span class="updated" id="last-updated">데이터 로딩 중...</span>
</header>

<div class="layout">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <h3>섹터 필터</h3>
    <button class="sector-btn active" data-sector="전체" onclick="filterSector('전체', this)">
      <span class="sector-dot" style="background:#888"></span>전체
    </button>
    <div id="sector-buttons"></div>

    <div style="margin-top:20px">
      <h3 style="margin-bottom:8px">📅 증시 일정</h3>
      <div id="market-events-list">
        <div style="color:#444;font-size:0.75rem;padding:8px 0">로딩 중...</div>
      </div>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="main">
    <!-- 캘린더 -->
    <div class="calendar-wrap">
      <div id="calendar"></div>
    </div>

    <!-- 날짜별 리포트 패널 -->
    <div class="day-panel">
      <div class="day-panel-header">
        <span class="day-panel-title" id="panel-title">전체 리포트</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="day-panel-count" id="panel-count"></span>
          <button class="day-panel-clear" id="panel-clear" onclick="clearDayFilter()" style="display:none">✕ 날짜 필터 해제</button>
        </div>
      </div>
      <div id="panel-content">
        <div class="empty-state">데이터 로딩 중...</div>
      </div>
    </div>
  </main>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const SECTOR_COLORS = {
  "반도체": "#4a90d9",
  "로봇":   "#2ecc71",
  "방산":   "#e74c3c",
  "조선":   "#f39c12",
  "2차전지":"#9b59b6",
  "바이오": "#1abc9c",
  "플랫폼": "#e67e22",
  "자동차": "#d35400",
  "금융":   "#27ae60",
  "건설":   "#7f8c8d",
  "철강":   "#95a5a6",
  "에너지": "#f1c40f",
};

let allReports = [];
let allEvents = [];
let calendar;
let currentSector = "전체";
let selectedDate = null;
let selectedDayEl = null;

async function loadData() {
  try {
    const [rRes, eRes] = await Promise.all([
      fetch("data/reports.json?t=" + Date.now()),
      fetch("data/market_events.json?t=" + Date.now()),
    ]);
    allReports = rRes.ok ? await rRes.json() : [];
    allEvents  = eRes.ok ? await eRes.json() : [];
  } catch(e) {
    allReports = []; allEvents = [];
  }

  setupSectorButtons();
  setupCalendar();
  renderPanel(getFilteredReports());
  renderMarketEvents();

  const lastDate = allReports.length ? allReports[0].date : "-";
  document.getElementById("last-updated").textContent = "최종 업데이트: " + lastDate;
}

function getFilteredReports() {
  let list = currentSector === "전체" ? allReports : allReports.filter(r => r.sector === currentSector);
  if (selectedDate) list = list.filter(r => r.date === selectedDate);
  return list;
}

function setupSectorButtons() {
  const sectors = [...new Set(allReports.map(r => r.sector))].filter(Boolean).sort();
  const container = document.getElementById("sector-buttons");
  container.innerHTML = "";
  sectors.forEach(sector => {
    const color = SECTOR_COLORS[sector] || "#888";
    const btn = document.createElement("button");
    btn.className = "sector-btn";
    btn.dataset.sector = sector;
    btn.onclick = () => filterSector(sector, btn);
    btn.innerHTML = `<span class="sector-dot" style="background:${color}"></span>${sector}`;
    container.appendChild(btn);
  });
}

function setupCalendar() {
  const el = document.getElementById("calendar");

  const calEvents = allReports.map(r => ({
    title: `${r.company}`,
    date: r.date,
    color: SECTOR_COLORS[r.sector] || "#555",
    extendedProps: r,
  }));

  const marketCalEvents = allEvents.map(e => ({
    title: "⚡ " + e.name,
    date: e.date,
    color: "#c0392b",
    extendedProps: { type: "market_event", ...e },
  }));

  calendar = new FullCalendar.Calendar(el, {
    initialView: "dayGridMonth",
    locale: "ko",
    height: "auto",
    dayMaxEvents: 5,           // 날짜 칸당 최대 5개 표시, 이후 "+N more"
    events: [...calEvents, ...marketCalEvents],

    // 날짜 칸 클릭 → 해당 날 리포트 표시
    dateClick: (info) => {
      const dateStr = info.dateStr;

      // 같은 날 다시 클릭하면 해제
      if (selectedDate === dateStr) {
        clearDayFilter();
        return;
      }

      // 이전 선택 해제
      if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
      selectedDate = dateStr;
      selectedDayEl = info.dayEl;
      info.dayEl.classList.add("fc-day-selected");

      document.getElementById("panel-clear").style.display = "inline";
      renderPanel(getFilteredReports());
    },

    // 이벤트(리포트) 클릭 → 상세 모달
    eventClick: (info) => {
      info.jsEvent.stopPropagation();
      const p = info.event.extendedProps;
      if (p.type === "market_event") {
        showModal(p.name, `<b>날짜:</b> ${p.date}<br><br>${p.description || ""}`);
      } else {
        openReportModal(p);
      }
    },

    // "+N more" 클릭 → 팝오버 대신 날짜 클릭처럼 처리
    moreLinkClick: (info) => {
      if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
      selectedDate = info.date.toISOString().split("T")[0];
      selectedDayEl = info.allSegs[0]?.el?.closest(".fc-daygrid-day") || null;
      if (selectedDayEl) selectedDayEl.classList.add("fc-day-selected");
      document.getElementById("panel-clear").style.display = "inline";
      renderPanel(getFilteredReports());
      return "stop";  // 팝오버 열지 않음
    },

    headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth" },
  });
  calendar.render();
}

function filterSector(sector, btn) {
  currentSector = sector;
  document.querySelectorAll(".sector-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  // 캘린더 이벤트 필터링
  calendar.getEvents().forEach(ev => {
    const p = ev.extendedProps;
    if (p.type === "market_event") return;
    ev.setProp("display", sector === "전체" || p.sector === sector ? "auto" : "none");
  });

  renderPanel(getFilteredReports());
}

function clearDayFilter() {
  selectedDate = null;
  if (selectedDayEl) selectedDayEl.classList.remove("fc-day-selected");
  selectedDayEl = null;
  document.getElementById("panel-clear").style.display = "none";
  renderPanel(getFilteredReports());
}

function renderPanel(reports) {
  const title = document.getElementById("panel-title");
  const count = document.getElementById("panel-count");
  const content = document.getElementById("panel-content");

  // 제목
  let titleText = currentSector === "전체" ? "전체 리포트" : `${currentSector} 리포트`;
  if (selectedDate) titleText = `${selectedDate} 리포트`;
  title.textContent = titleText;
  count.textContent = reports.length + "개";

  if (!reports.length) {
    content.innerHTML = '<div class="empty-state">해당 날짜에 리포트가 없습니다</div>';
    return;
  }

  // 날짜 선택 시 → 리스트 형태
  if (selectedDate) {
    content.innerHTML = `<div class="report-list">${
      reports.map(r => {
        const color = SECTOR_COLORS[r.sector] || "#888";
        return `
          <div class="report-row" onclick="openReportModal(${JSON.stringify(r).replace(/"/g,'&quot;')})">
            <div class="report-row-dot" style="background:${color}"></div>
            <div class="report-row-body">
              <div class="report-row-sector" style="color:${color}">${r.sector}</div>
              <div class="report-row-title">${r.company} · ${r.firm}</div>
              <div class="report-row-meta">${r.title || ""}</div>
            </div>
            <div class="report-row-type">${r.type === "industry" ? "산업" : "종목"}</div>
          </div>`;
      }).join("")
    }</div>`;
  } else {
    // 날짜 미선택 → 카드 그리드
    content.innerHTML = `<div class="cards-grid">${
      reports.slice(0, 60).map(r => {
        const color = SECTOR_COLORS[r.sector] || "#888";
        const summary = (r.summary || "").substring(0, 100) + (r.summary && r.summary.length > 100 ? "..." : "");
        const price = r.target_price
          ? `<span class="card-price">목표 ${Number(r.target_price).toLocaleString()}원</span>` : "";
        return `
          <div class="card" onclick="openReportModal(${JSON.stringify(r).replace(/"/g,'&quot;')})">
            <div class="card-sector" style="color:${color}">${r.sector}</div>
            <div class="card-title">${r.company} · ${r.firm}</div>
            <div class="card-meta">${r.date} · ${(r.title||"").substring(0,38)}</div>
            ${summary ? `<div class="card-summary">${summary}</div>` : ""}
            ${price}
          </div>`;
      }).join("")
    }</div>`;
  }
}

function openReportModal(r) {
  if (typeof r === "string") r = JSON.parse(r);
  const price = r.target_price ? `<b>목표주가:</b> ${Number(r.target_price).toLocaleString()}원<br>` : "";
  const summary = r.summary ? `<br><b>요약:</b><br>${r.summary.replace(/\n/g,"<br>")}` : "";
  const link = r.link ? `<br><br><a href="${r.link}" target="_blank">원문 보기 →</a>` : "";
  showModal(
    `[${r.sector}] ${r.company} — ${r.firm}`,
    `<b>날짜:</b> ${r.date}<br><b>리포트:</b> ${r.title || "-"}<br>${price}${summary}${link}`
  );
}

function renderMarketEvents() {
  const container = document.getElementById("market-events-list");
  const today = new Date().toISOString().split("T")[0];
  const upcoming = allEvents
    .filter(e => e.date >= today)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 8);

  if (!upcoming.length) {
    container.innerHTML = '<div style="color:#444;font-size:0.75rem">일정 없음</div>';
    return;
  }
  container.innerHTML = upcoming.map(e => `
    <div class="event-item" style="cursor:pointer" onclick="showModal('${e.name}','<b>날짜:</b> ${e.date}<br><br>${(e.description||"").replace(/'/g,"\\'")}')">
      <div class="event-date">${e.date}</div>
      <div class="event-name">${e.name}</div>
    </div>`).join("");
}

function showModal(title, body) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal").classList.add("open");
}
function closeModal() {
  document.getElementById("modal").classList.remove("open");
}
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

loadData();
</script>
</body>
</html>
