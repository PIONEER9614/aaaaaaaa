<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투자 인텔리전스 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
    }
    header h1 { font-size: 1.4rem; color: #fff; }
    header .updated { font-size: 0.8rem; color: #888; }

    .layout { display: flex; height: calc(100vh - 65px); }

    /* 사이드바 */
    .sidebar {
      width: 280px; min-width: 280px;
      background: #1a1a2e;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      padding: 16px;
    }
    .sidebar h3 { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

    .sector-btn {
      display: block; width: 100%; text-align: left;
      background: #16213e; border: 1px solid #2a2a4a;
      color: #ccc; padding: 10px 14px; margin-bottom: 6px;
      border-radius: 8px; cursor: pointer; font-size: 0.85rem;
      transition: all 0.2s;
    }
    .sector-btn:hover, .sector-btn.active { background: #0f3460; border-color: #4a90d9; color: #fff; }
    .sector-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }

    .market-events { margin-top: 20px; }
    .event-item {
      background: #16213e; border-left: 3px solid #e74c3c;
      padding: 8px 12px; margin-bottom: 6px; border-radius: 4px;
      font-size: 0.8rem;
    }
    .event-item .event-date { color: #e74c3c; font-weight: bold; font-size: 0.75rem; }
    .event-item .event-name { color: #eee; margin-top: 2px; }

    /* 메인 */
    .main { flex: 1; overflow: auto; padding: 20px; }

    /* 캘린더 */
    .calendar-wrap {
      background: #1a1a2e; border-radius: 12px;
      padding: 16px; margin-bottom: 20px;
      border: 1px solid #2a2a4a;
    }
    .fc { color: #ccc; }
    .fc-toolbar-title { color: #fff !important; font-size: 1.1rem !important; }
    .fc-button { background: #16213e !important; border-color: #2a2a4a !important; color: #ccc !important; }
    .fc-button:hover { background: #0f3460 !important; }
    .fc-day-today { background: rgba(74, 144, 217, 0.1) !important; }
    .fc-daygrid-day-number { color: #aaa; }
    .fc-col-header-cell { background: #16213e; }
    .fc-col-header-cell-cushion { color: #888; }
    .fc-event { border-radius: 4px; font-size: 0.72rem; cursor: pointer; }
    .fc-daygrid-dot-event { padding: 2px 4px; }

    /* 리포트 카드 영역 */
    .reports-section h2 { font-size: 1rem; color: #aaa; margin-bottom: 14px; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .card {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 10px; padding: 16px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #4a90d9; }
    .card-sector {
      font-size: 0.7rem; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 6px;
    }
    .card-title { font-size: 0.9rem; color: #fff; margin-bottom: 6px; font-weight: 600; }
    .card-meta { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
    .card-summary { font-size: 0.82rem; color: #bbb; line-height: 1.5; }
    .card-price {
      display: inline-block; margin-top: 8px;
      background: rgba(46, 204, 113, 0.15); color: #2ecc71;
      border-radius: 4px; padding: 2px 8px; font-size: 0.75rem; font-weight: bold;
    }
    .card-link { display: block; margin-top: 8px; font-size: 0.75rem; color: #4a90d9; text-decoration: none; }
    .card-link:hover { text-decoration: underline; }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 12px; padding: 24px; max-width: 600px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal h2 { color: #fff; font-size: 1rem; margin-bottom: 12px; }
    .modal-close {
      float: right; background: none; border: none;
      color: #888; font-size: 1.2rem; cursor: pointer;
    }
    .modal-body { font-size: 0.85rem; color: #ccc; line-height: 1.6; }

    .empty-state { text-align: center; color: #555; padding: 40px; }
  </style>
</head>
<body>

<header>
  <h1>📊 투자 인텔리전스 대시보드</h1>
  <span class="updated" id="last-updated">데이터 로딩 중...</span>
</header>

<div class="layout">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <h3>섹터 필터</h3>
    <button class="sector-btn active" data-sector="전체" onclick="filterSector('전체', this)">
      <span class="sector-dot" style="background:#888"></span> 전체
    </button>
    <div id="sector-buttons"></div>

    <div class="market-events">
      <h3 style="margin-top:20px">📅 주요 증시 일정</h3>
      <div id="market-events-list">
        <div class="empty-state" style="padding:20px;font-size:0.8rem">로딩 중...</div>
      </div>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="main">
    <div class="calendar-wrap">
      <div id="calendar"></div>
    </div>

    <div class="reports-section">
      <h2 id="section-title">전체 리포트</h2>
      <div class="cards-grid" id="cards-grid">
        <div class="empty-state">데이터 로딩 중...</div>
      </div>
    </div>
  </main>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modal-title"></h2>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const SECTOR_COLORS = {
  "반도체": "#4a90d9",
  "로봇":   "#2ecc71",
  "방산":   "#e74c3c",
  "조선":   "#f39c12",
  "2차전지":"#9b59b6",
  "바이오": "#1abc9c",
  "플랫폼": "#e67e22",
  "자동차": "#d35400",
  "금융":   "#27ae60",
  "건설":   "#7f8c8d",
  "철강":   "#95a5a6",
  "에너지": "#f1c40f",
};

let allReports = [];
let allEvents = [];
let calendar;
let currentSector = "전체";

async function loadData() {
  try {
    const [reportsRes, eventsRes] = await Promise.all([
      fetch("data/reports.json?t=" + Date.now()),
      fetch("data/market_events.json?t=" + Date.now()),
    ]);
    allReports = reportsRes.ok ? await reportsRes.json() : [];
    allEvents  = eventsRes.ok  ? await eventsRes.json()  : [];
  } catch(e) {
    allReports = [];
    allEvents = [];
  }

  setupSectorButtons();
  setupCalendar();
  renderCards(allReports);
  renderMarketEvents();

  const lastDate = allReports.length ? allReports[0].date : "-";
  document.getElementById("last-updated").textContent = "최종 업데이트: " + lastDate;
}

function setupSectorButtons() {
  const sectors = [...new Set(allReports.map(r => r.sector))].filter(Boolean);
  const container = document.getElementById("sector-buttons");
  container.innerHTML = "";
  sectors.forEach(sector => {
    const color = SECTOR_COLORS[sector] || "#888";
    const btn = document.createElement("button");
    btn.className = "sector-btn";
    btn.dataset.sector = sector;
    btn.onclick = () => filterSector(sector, btn);
    btn.innerHTML = `<span class="sector-dot" style="background:${color}"></span> ${sector}`;
    container.appendChild(btn);
  });
}

function setupCalendar() {
  const el = document.getElementById("calendar");

  // 리포트를 캘린더 이벤트로 변환
  const calEvents = allReports.map(r => ({
    title: `[${r.sector}] ${r.company}`,
    date: r.date,
    color: SECTOR_COLORS[r.sector] || "#555",
    extendedProps: r,
  }));

  // 증시 일정 추가
  const marketCalEvents = allEvents.map(e => ({
    title: "⚡ " + e.name,
    date: e.date,
    color: "#e74c3c",
    extendedProps: { type: "market_event", ...e },
  }));

  calendar = new FullCalendar.Calendar(el, {
    initialView: "dayGridMonth",
    locale: "ko",
    height: 380,
    events: [...calEvents, ...marketCalEvents],
    eventClick: (info) => {
      const p = info.event.extendedProps;
      if (p.type === "market_event") {
        showModal(p.name, `<b>날짜:</b> ${p.date}<br><br>${p.description || ""}`);
      } else {
        showModal(
          `[${p.sector}] ${p.company} - ${p.firm}`,
          `<b>날짜:</b> ${p.date}<br>
           <b>제목:</b> ${p.title}<br>
           ${p.target_price ? `<b>목표주가:</b> ${Number(p.target_price).toLocaleString()}원<br>` : ""}
           <br><b>요약:</b><br>${(p.summary || "").replace(/\n/g, "<br>")}<br>
           ${p.link ? `<br><a href="${p.link}" target="_blank" style="color:#4a90d9">원문 보기 →</a>` : ""}`
        );
      }
    },
    headerToolbar: { left: "prev,next today", center: "title", right: "" },
  });
  calendar.render();
}

function filterSector(sector, btn) {
  currentSector = sector;
  document.querySelectorAll(".sector-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  const filtered = sector === "전체" ? allReports : allReports.filter(r => r.sector === sector);
  renderCards(filtered);
  document.getElementById("section-title").textContent =
    (sector === "전체" ? "전체" : sector) + " 리포트";
}

function renderCards(reports) {
  const grid = document.getElementById("cards-grid");
  if (!reports.length) {
    grid.innerHTML = '<div class="empty-state">리포트가 없습니다</div>';
    return;
  }
  grid.innerHTML = reports.slice(0, 50).map(r => {
    const color = SECTOR_COLORS[r.sector] || "#888";
    const price = r.target_price
      ? `<span class="card-price">목표주가 ${Number(r.target_price).toLocaleString()}원</span>` : "";
    const summary = (r.summary || "").substring(0, 120) + (r.summary && r.summary.length > 120 ? "..." : "");
    return `
      <div class="card" onclick='showModal(
        "[${r.sector}] ${r.company} - ${r.firm}",
        "<b>날짜:</b> ${r.date}<br><b>제목:</b> ${(r.title||"").replace(/"/g,"&quot;")}<br><br><b>요약:</b><br>${(r.summary||"").replace(/\n/g,"<br>").replace(/"/g,"&quot;")}<br>${r.link ? "<br><a href=\'" + r.link + "\' target=\'_blank\' style=\'color:#4a90d9\'>원문 보기 →</a>" : ""}"
      )'>
        <div class="card-sector" style="color:${color}">${r.sector}</div>
        <div class="card-title">${r.company} · ${r.firm}</div>
        <div class="card-meta">${r.date} · ${r.title ? r.title.substring(0,40) : ""}</div>
        <div class="card-summary">${summary}</div>
        ${price}
      </div>`;
  }).join("");
}

function renderMarketEvents() {
  const container = document.getElementById("market-events-list");
  const today = new Date().toISOString().split("T")[0];
  const upcoming = allEvents
    .filter(e => e.date >= today)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 8);

  if (!upcoming.length) {
    container.innerHTML = '<div style="color:#555;font-size:0.8rem;padding:10px">일정 없음</div>';
    return;
  }
  container.innerHTML = upcoming.map(e => `
    <div class="event-item">
      <div class="event-date">${e.date}</div>
      <div class="event-name">${e.name}</div>
    </div>`).join("");
}

function showModal(title, body) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal").classList.add("open");
}
function closeModal() {
  document.getElementById("modal").classList.remove("open");
}
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

loadData();
</script>
</body>
</html>
